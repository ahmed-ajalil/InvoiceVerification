<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Caterer Invoices – Modern Admin</title>
<style>
  :root{
    --bg: #f7f8fb;
    --card:#ffffff;
    --muted:#8a93a6;
    --text:#374264;
    --accent:#0069B4;
    --accent-2:#00b894;
    --danger:#C8102E;
    --warning:#ffb020;
    --stroke:#e7eaf3;
    --chip:#f1f5ff;
    --shadow: 0 10px 30px rgba(23, 32, 90, .08);
    --radius:16px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at -10% -20%, #e9f3ff 0%, transparent 50%),
      radial-gradient(800px 400px at 110% 0%, #ffe9ef 0%, transparent 40%),
      var(--bg);
  }

  /* Topbar with main menu */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom:1px solid var(--stroke)}
  .topbar-inner{max-width:1200px; margin:auto; display:flex; align-items:center; gap:14px; justify-content:space-between; padding:14px 20px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.3px; color:var(--text)}
  .brand svg{width:28px;height:28px; color:var(--accent)}
  nav.nav{display:flex; gap:10px; flex-wrap:wrap}
  nav.nav a{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; text-decoration:none; color:var(--text); border:1px solid transparent; font-weight:600}
  nav.nav a svg{width:16px; height:16px; color:var(--muted)}
  nav.nav a.active, nav.nav a:hover{background:var(--chip); border-color:#d9e6ff}
  .chip{background:var(--chip); color:var(--accent); border:1px solid #d9e6ff; padding:6px 10px; border-radius:999px; font-weight:600; white-space:nowrap}

  .wrap{max-width:1200px; margin:24px auto 80px; padding:0 20px}
  .grow{flex:1 1 auto}

  .card{background:var(--card); border:1px solid var(--stroke); border-radius:var(--radius); box-shadow:var(--shadow)}
  .card-head{padding:18px 18px 0 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .card-title{font-size:18px; font-weight:700}
  .divider{height:1px; background:var(--stroke); margin:16px 0}

  /* Upload controls */
  .filebox{display:flex; align-items:center; gap:10px}
  input[type="file"]{display:none}
  .filelabel{border:1px dashed #cfe0ff; padding:10px 12px; border-radius:12px; cursor:pointer; background:#f7fbff; color:var(--accent); font-weight:700}
  .filename{color:var(--muted); font-weight:600}

  .toolbar{padding:0 18px 16px 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .toolbar .search{position:relative; flex:1 1 280px}
  .toolbar input[type="search"], .toolbar input[type="date"]{height:38px; padding:0 12px 0 36px; border-radius:10px; border:1px solid var(--stroke); background:#fff; outline:none; font-weight:500; color:var(--text)}
  .toolbar .search svg{width:16px; height:16px; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .date-range{display:flex; gap:8px; align-items:center}
  .date-wrap{position:relative}
  .date-wrap svg{width:16px; height:16px; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .date-wrap input{padding-left:34px}

  .btn{appearance:none; border:1px solid transparent; background:var(--accent); color:#fff; padding:10px 14px; border-radius:12px; font-weight:700; cursor:pointer; transition:transform .06s ease, box-shadow .2s ease, background .2s ease; box-shadow: 0 6px 16px rgba(0,105,180,.22)}
  .btn:hover{transform:translateY(-1px)}
  .btn.secondary{background:#f5f7fb; color:var(--text); border:1px solid var(--stroke); box-shadow:none}
  .btn.small{padding:8px 10px; border-radius:10px; font-size:12px}

  .table-wrap{overflow:auto}

  /* NEW: Flat table (no rounded row pills, lighter look) */
  table{width:100%; border-collapse:collapse; margin:0}
  thead th{text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:10px 12px; background:#fff; position:sticky; top:0}
  tbody td{padding:12px; vertical-align:middle; font-weight:400}
  tbody tr{background:#fff; border-bottom:1px solid var(--stroke)}
  .muted{color:var(--muted)}
  .cell-actions{display:flex; gap:6px; align-items:center; justify-content:flex-end}
  .badge{display:inline-flex; align-items:center; gap:6px; background:#f7f9ff; border:1px solid #ebf1ff; color:#2b3b7e; padding:6px 8px; border-radius:999px; font-weight:500; font-size:12px}
  .select-col{width:40px}
  .name-col{min-width:320px}
  .sticky-foot{display:flex; justify-content:space-between; align-items:center; padding:12px 18px 18px 18px; color:var(--muted)}
  .pager{display:flex; gap:6px}
  .pager button{border:1px solid var(--stroke); background:#fff; padding:8px 12px; border-radius:10px; cursor:pointer; color:var(--text)}
  .pager .active{background:#eef4ff; border-color:#d6e4ff; color:#113e88; font-weight:700}

  /* Icon-only action buttons (lighter colors) */
  .icon-btn{border:none; background:transparent; padding:6px; border-radius:8px; cursor:pointer; color:#6b7897}
  .icon-btn:hover{background:#f4f7ff; color:#3259a8}
  .icon-btn svg{width:18px; height:18px; display:block}
  .icon-view{color:#6b7897}
  .icon-download{color:#5c9c7d}
  .icon-delete{color:#b45b67}

  /* Modal */
  .modal{position:fixed; inset:0; display:none; place-items:center; background:rgba(14,18,33,.4); z-index:40; padding:20px}
  .modal.open{display:grid}
  .modal-card{width:min(100%, 980px); background:var(--card); border:1px solid var(--stroke); border-radius:18px; box-shadow:0 24px 64px rgba(0,0,0,.22); overflow:hidden; max-height:85vh; display:flex; flex-direction:column}
  .modal-head{padding:16px 18px; display:flex; align-items:center; gap:10px}
  .modal-head h3{margin:0; font-size:18px}
  .modal-body{padding:0 18px 18px 18px; overflow:auto}
  .close{margin-left:auto; border:none; background:#f4f6fb; border:1px solid var(--stroke); border-radius:10px; padding:8px 10px; cursor:pointer}

  /* Checkbox */
  .cb{width:18px;height:18px;border:1.5px solid #b6c2e2;border-radius:6px; display:inline-grid; place-items:center; cursor:pointer; transition: all .18s ease-in-out; background:#fff}
  .cb input{display:none}
  .cb svg{opacity:0; width:14px; height:14px; color:#fff}
  .cb.checked{background:var(--accent); border-color:var(--accent)}
  .cb.checked svg{opacity:1}
</style>
</head>
<body>
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 12s3-8 9-8 9 8 9 8-3 8-9 8-9-8-9-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        Caterer Invoices
      </div>
      <nav class="nav">
        <a class="active" href="#">Dashboard</a>
        <a href="#">Invoices</a>
        <a href="#">Downloads</a>
        <a href="#">Help & Docs</a>
      </nav>
      <span class="chip">gulfair@unifycloud.com</span>
    </div>
  </div>

  <div class="wrap">
    <main class="card">
      <div class="card-head">
        <div class="card-title">Upload File</div>
        <div class="grow"></div>
        <div class="filebox">
          <label class="filelabel" for="fileInput">Choose Files</label>
          <input id="fileInput" type="file" multiple />
          <span id="fileName" class="filename">No file chosen</span>
          <button id="btnUpload" class="btn">Upload Files</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="toolbar">
        <button id="btnBulk" class="btn secondary">Take Action</button>
        <div class="grow"></div>
        <button id="btnExport" class="btn secondary">Download Excel</button>

        <div class="date-range">
          <div class="date-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input id="dateFrom" type="date" aria-label="From date" />
          </div>
          <span class="muted">to</span>
          <div class="date-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input id="dateTo" type="date" aria-label="To date" />
          </div>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search records…" />
        </div>
      </div>

      <div class="table-wrap">
        <table id="filesTable">
          <thead>
            <tr>
              <th class="select-col"><label class="cb" id="selectAll"><input type="checkbox" /></label></th>
              <th class="name-col">Name</th>
              <th>Size</th>
              <th>Uploaded</th>
              <th class="cell-actions">Action</th>
            </tr>
          </thead>
          <tbody><!-- rows by JS --></tbody>
        </table>
      </div>

      <div class="sticky-foot">
        <div id="summary" class="muted">Showing 0 entries</div>
        <div class="pager" id="pager"><!-- buttons by JS --></div>
      </div>
    </main>
  </div>

  <!-- Modal: Meal Invoice Cost Validation Data -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Meal Invoice Cost Validation Data</h3>
        <div class="grow"></div>
        <button class="btn small secondary" id="btnExportModal">Download Excel</button>
        <button class="close" id="btnClose">Close</button>
      </div>
      <div class="modal-body">
        <div class="toolbar" style="padding-left:0;padding-right:0;padding-top:0">
          <div class="search grow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="modalSearch" type="search" placeholder="Search rows…" />
          </div>
        </div>
        <div class="table-wrap">
          <table id="modalTable">
            <thead>
              <tr>
                <th>Internal Flight Date</th>
                <th>Caterer Flight Date</th>
                <th>Internal Flight Number</th>
                <th>Caterer Flight Number</th>
              </tr>
            </thead>
            <tbody><!-- rows by JS --></tbody>
          </table>
        </div>
        <div class="sticky-foot" style="padding-left:0;padding-right:0">
          <div id="modalSummary" class="muted">Showing 0 entries</div>
          <div class="pager" id="modalPager"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* =========================
   Demo Data (from screenshots)
   ========================= */
const files = [
  {name:'Sample Caterer Invoice_BAHLHR_TST.xlsx', size: '132 KB', date:'2025-05-01'},
  {name:'Sample Caterer Invoice_LHR_TST_3.xlsx', size: '120 KB', date:'2025-05-02'},
  {name:'Sample Caterer Invoice_LHR_TST_3.xlsx', size: '121 KB', date:'2025-05-03'},
  {name:'Sample Caterer Invoice_LHR_TST_3.xlsx', size: '118 KB', date:'2025-05-05'},
  {name:'Sample Caterer Invoice_LHR_TST_2.xlsx', size: '115 KB', date:'2025-05-06'},
  {name:'GF MAR2025 test 2.xlsx', size: '96 KB', date:'2025-05-07'},
  {name:'Sample Caterer Invoice_LHR_TST_1.xlsx', size: '110 KB', date:'2025-05-08'},
  {name:'Sample Caterer Invoice_LHR_TST.xlsx', size: '112 KB', date:'2025-05-10'},
  {name:'Sample Caterer Invoice_LHR_TST.xlsx', size: '112 KB', date:'2025-05-11'},
  {name:'Sample Caterer Invoice_LHR_TST.xlsx', size: '112 KB', date:'2025-05-12'},
  {name:'Sample Caterer Invoice_LHR_TST.xlsx', size: '112 KB', date:'2025-05-13'},
  {name:'Sample Caterer Invoice_LHR_TST.xlsx', size: '112 KB', date:'2025-05-14'}
];

const modalRows = [
  {ifd:'05/05/2025', cfd:'05/05/2025', ifn:'3', cfn:'GF0003'},
  {ifd:'—', cfd:'23/04/2025', ifn:'', cfn:'GF0009'},
  {ifd:'01/03/2025', cfd:'01/03/2025', ifn:'3', cfn:'3'},
  {ifd:'03/03/2025', cfd:'03/03/2025', ifn:'3', cfn:'3'},
  {ifd:'04/03/2025', cfd:'04/03/2025', ifn:'7', cfn:'7'},
  {ifd:'11/03/2025', cfd:'11/03/2025', ifn:'3', cfn:'3'},
  {ifd:'12/03/2025', cfd:'12/03/2025', ifn:'7', cfn:'7'},
  {ifd:'15/03/2025', cfd:'15/03/2025', ifn:'7', cfn:'7'}
];

/* ========= Utilities ========= */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const makeCB = () => {
  const label = document.createElement('label');
  label.className='cb'; label.innerHTML='<input type="checkbox" />\n    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
  label.addEventListener('click', e=>{
    if(e.target.tagName==='INPUT') return;
    label.classList.toggle('checked');
    const input = label.querySelector('input'); input.checked = label.classList.contains('checked');
    e.preventDefault();
  });
  return label;
};
const toCSV = (rows) => rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
const downloadFile = (filename, content, mime='text/csv')=>{
  const blob = new Blob([content],{type:mime}); const a=document.createElement('a');
  a.href= URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
};

/* ========= Files Table ========= */
const state = {page:1, perPage:10, query:'', from:null, to:null};

function renderTable(){
  const tbody = $('#filesTable tbody');
  tbody.innerHTML = '';
  let filtered = files.filter(f => f.name.toLowerCase().includes(state.query));
  if(state.from){ filtered = filtered.filter(f => new Date(f.date) >= new Date(state.from)); }
  if(state.to){ filtered = filtered.filter(f => new Date(f.date) <= new Date(state.to)); }

  const total = filtered.length;
  const maxPage = Math.max(1, Math.ceil(total/state.perPage));
  state.page = Math.min(state.page, maxPage);
  const start = (state.page-1)*state.perPage;
  const pageRows = filtered.slice(start, start+state.perPage);

  pageRows.forEach((f)=>{
    const tr = document.createElement('tr');

    const td0 = document.createElement('td'); td0.className='select-col';
    const cb = makeCB(); td0.appendChild(cb); tr.appendChild(td0);

    const td1 = document.createElement('td'); td1.className='name-col';
    td1.innerHTML = `<div style="display:flex; align-items:center; gap:10px">
      <span class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16l6-3 6 3V6"/></svg>
        .xlsx
      </span>
      <div>${f.name}</div>
    </div>`;
    tr.appendChild(td1);

    const td2 = document.createElement('td'); td2.textContent=f.size; td2.className='muted'; tr.appendChild(td2);
    const td3 = document.createElement('td'); td3.textContent=f.date; td3.className='muted'; tr.appendChild(td3);

    const td4 = document.createElement('td'); td4.className='cell-actions';
    td4.append(
      makeIconBtn('view', ()=>openModal()),
      makeIconBtn('download', ()=>alert('Downloading: ' + f.name)),
      makeIconBtn('delete', ()=>{ if(confirm('Delete "'+f.name+'"?')){ files.splice(files.indexOf(f),1); renderTable(); }})
    );
    tr.appendChild(td4);

    tbody.appendChild(tr);
  });

  $('#summary').textContent = `Showing ${Math.min(total, start+pageRows.length)} of ${total} entries`;
  renderPager('#pager', total, state, renderTable);
}

function makeIconBtn(type, handler){
  const btn = document.createElement('button'); btn.className='icon-btn';
  let path='';
  if(type==='view'){ btn.classList.add('icon-view'); path='<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>'; }
  if(type==='download'){ btn.classList.add('icon-download'); path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'; }
  if(type==='delete'){ btn.classList.add('icon-delete'); path='<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'; }
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>`;
  btn.addEventListener('click', handler);
  return btn;
}

function renderPager(sel, total, st, onChange){
  const el = $(sel); el.innerHTML='';
  const pages = Math.max(1, Math.ceil(total/st.perPage));
  const build = (label, page, active=false) => {
    const b = document.createElement('button');
    b.textContent = label; if(active) b.classList.add('active');
    b.addEventListener('click',()=>{ st.page = page; onChange(); });
    return b;
  };
  el.appendChild(build('Prev', Math.max(1, st.page-1)));
  for(let p=1;p<=pages;p++) el.appendChild(build(String(p), p, p===st.page));
  el.appendChild(build('Next', Math.min(pages, st.page+1)));
}

/* ========= Modal Table ========= */
const mstate = {page:1, perPage:10, query:''};
function openModal(){ $('#modal').classList.add('open'); renderModal(); }
function closeModal(){ $('#modal').classList.remove('open'); }
function renderModal(){
  const tbody = $('#modalTable tbody'); tbody.innerHTML='';
  const filtered = modalRows.filter(r => Object.values(r).join(' ').toLowerCase().includes(mstate.query));
  const total = filtered.length; const maxPage = Math.max(1, Math.ceil(total/mstate.perPage)); mstate.page = Math.min(mstate.page, maxPage);
  const start = (mstate.page-1)*mstate.perPage; const rows = filtered.slice(start, start+mstate.perPage);
  rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML = `<td>${r.ifd}</td><td>${r.cfd}</td><td>${r.ifn}</td><td>${r.cfn}</td>`; tbody.appendChild(tr); });
  $('#modalSummary').textContent = `Showing ${Math.min(total, start+rows.length)} of ${total} entries`;
  renderPager('#modalPager', total, mstate, renderModal);
}

/* ========= Interactions ========= */
$('#fileInput').addEventListener('change', (e)=>{
  const names = Array.from(e.target.files).map(f=>f.name);
  $('#fileName').textContent = names.length ? names.join(', ') : 'No file chosen';
});
$('#btnUpload').addEventListener('click', ()=>{
  const filesPicked = $('#fileInput').files;
  if(!filesPicked.length) return alert('Please choose one or more files.');
  Array.from(filesPicked).forEach(f=>{
    files.unshift({name:f.name, size: (Math.max(1, Math.round(f.size/1024)))+' KB', date: new Date().toISOString().slice(0,10)});
  });
  $('#fileInput').value=''; $('#fileName').textContent='No file chosen';
  renderTable();
});

$('#search').addEventListener('input', (e)=>{ state.query = e.target.value.trim().toLowerCase(); state.page=1; renderTable(); });
$('#dateFrom').addEventListener('change', (e)=>{ state.from = e.target.value || null; state.page=1; renderTable(); });
$('#dateTo').addEventListener('change', (e)=>{ state.to = e.target.value || null; state.page=1; renderTable(); });

$('#modalSearch').addEventListener('input', (e)=>{ mstate.query = e.target.value.trim().toLowerCase(); mstate.page=1; renderModal(); });

$('#btnExport').addEventListener('click', ()=>{
  const rows = [['Name','Size','Uploaded']].concat(files.map(f=>[f.name,f.size,f.date]));
  downloadFile('caterer-files.csv', toCSV(rows));
});
$('#btnExportModal').addEventListener('click', ()=>{
  const rows = [['Internal Flight Date','Caterer Flight Date','Internal Flight Number','Caterer Flight Number']]
    .concat(modalRows.map(r=>[r.ifd,r.cfd,r.ifn,r.cfn]));
  downloadFile('meal-invoice-validation.csv', toCSV(rows));
});

$('#btnClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', (e)=>{ if(e.target.id==='modal') closeModal(); });

/* Select all */
(function initSelectAll(){
  const lbl = $('#selectAll');
  lbl.addEventListener('click', (e)=>{
    if(e.target.tagName==='INPUT') return;
    const checked = !lbl.classList.contains('checked');
    $$('#filesTable tbody .cb').forEach(cb=>{
      if(checked && !cb.classList.contains('checked')) cb.classList.add('checked');
      if(!checked && cb.classList.contains('checked')) cb.classList.remove('checked');
      cb.querySelector('input').checked = checked;
    });
  });
})();

/* Seed & paint */
renderTable();
</script>
</body>
</html>
